name: Brand New Notes

on:
  push:
    branches:
      - main
      - structer-of-project

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: tests-act
    timeout-minutes: 30
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            cd /home/ubuntu/backend/2026_2_BNN
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            sudo docker compose up -d --build