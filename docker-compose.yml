services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bnn-backend
    ports:
      - "5458:5458"
    environment:
      # Секрет для JWT. В проде — взять из .env, не хардкодить.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
    restart: unless-stopped
    healthcheck:
      # Проверяем, что приложение отвечает на /api/notes (или другой публичный эндпоинт).
      # wget есть в alpine из коробки.
      test: ["CMD", "wget", "-qO-", "http://localhost:5458/api/notes"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s