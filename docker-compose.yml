services:
  postgres:
    image: postgres:17-alpine
    container_name: bnn-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.20.1
    container_name: bnn-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    restart: "no"

  s3:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: bnn-s3
    command: ["silo", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is not set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is not set}
    volumes:
      - s3-data:/data
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: build/main.Dockerfile
      args:
        SERVICE: auth
    container_name: bnn-auth
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_started
    volumes:
      - ./certs:/certs:ro
    environment:
      GRPC_TLS_CA: /certs/ca.crt
      GRPC_TLS_CERT: /certs/service.crt
      GRPC_TLS_KEY: /certs/service.key
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set}
      S3_ENDPOINT: s3:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_AVATARS_BUCKET: avatars
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
    restart: unless-stopped

  notes:
    build:
      context: .
      dockerfile: build/main.Dockerfile
      args:
        SERVICE: notes
    container_name: bnn-notes
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_started
    volumes:
      - ./certs:/certs:ro
    environment:
      GRPC_TLS_CA: /certs/ca.crt
      GRPC_TLS_CERT: /certs/service.crt
      GRPC_TLS_KEY: /certs/service.key
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      AUTH_GRPC_ADDR: auth:9001
      S3_ENDPOINT: s3:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_ATTACHMENTS_BUCKET: attachments
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: build/main.Dockerfile
      args:
        SERVICE: main
    container_name: bnn-backend
    depends_on:
      auth:
        condition: service_started
      notes:
        condition: service_started
    ports:
      - "127.0.0.1:5458:5458"
    volumes:
      - ./certs:/certs:ro
    environment:
      GRPC_TLS_CA: /certs/ca.crt
      GRPC_TLS_CERT: /certs/service.crt
      GRPC_TLS_KEY: /certs/service.key
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is not set}
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH_GRPC_ADDR: auth:9001
      NOTES_GRPC_ADDR: notes:9002
      ONLINECONF_GRPC_ADDR: onlineconf:9004
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: bnn-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    container_name: bnn-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana-enterprise:12.1.0
    container_name: bnn-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is not set}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - backend
      - grafana
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/public:/opt/public:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data:
  prometheus-data:
  grafana-data:
  