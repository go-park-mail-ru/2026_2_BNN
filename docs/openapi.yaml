openapi: "3.0.3"
info:
  title: BNN Notes API
  version: 1.0.0
  description: |
    Авторизация через куки bnn_access (15 мин) и bnn_refresh (30 дней).
    На 401 вызвать /auth/refresh и повторить запрос. Если refresh тоже 401, то на страницу входа.
    У ошибок нет тела.

servers:
 # - url: /api
  - url: http://localhost:5458/api
    descrIption: DEV LOCAL
  - url: http://brandnewnotes.ru/api
    descrIption: DEV LOCAL
  

tags:
  - name: auth
    description: Регистрация, вход, сессии, профиль
  - name: notes
    description: Заметки и блоки
  - name: attachments
    description: Файлы в блоках заметок

paths:
  /auth/signup:
    post:
      tags: [auth]
      operationId: SignUp
      summary: Регистрация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Пользователь создан, ставятся куки bnn_access и bnn_refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Не прошла валидация или битый JSON
        '409':
          description: Логин занят
        '413':
          description: Тело запроса больше 4096 байт

  /auth/signin:
    post:
      tags: [auth]
      operationId: SignIn
      summary: Вход
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Вход выполнен, ставятся куки bnn_access и bnn_refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Не прошла валидация или битый JSON
        '401':
          description: Неверный логин или пароль
        '413':
          description: Тело запроса больше 4096 байт

  /auth/refresh:
    post:
      tags: [auth]
      operationId: Refresh
      summary: Обновить токены
      description: Берёт куку bnn_refresh, ставит новые bnn_access и bnn_refresh. Старый refresh больше не работает.
      responses:
        '200':
          description: Новые куки поставлены
        '401':
          description: Нет куки, refresh невалиден, уже использован или истёк

  /auth/logout:
    post:
      tags: [auth]
      operationId: Logout
      summary: Выход
      description: Удаляет сессию этого устройства и стирает обе куки. Работает и без куки.
      responses:
        '200':
          description: Выход выполнен

  /auth/me:
    get:
      tags: [auth]
      operationId: GetCurrentUser
      summary: Текущий пользователь
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Нет куки или она истекла
        '404':
          description: Пользователь не найден

  /auth/password:
    put:
      tags: [auth]
      operationId: ChangePassword
      summary: Сменить пароль
      description: Все остальные устройства разлогиниваются, текущему ставятся новые куки.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Пароль изменён, ставятся новые куки bnn_access и bnn_refresh
        '400':
          description: Новый пароль не прошёл валидацию или битый JSON
        '401':
          description: Нет куки или она истекла
        '403':
          description: Неверный старый пароль
        '413':
          description: Тело запроса больше 4096 байт

  /auth/avatar:
    put:
      tags: [auth]
      operationId: UpdateAvatar
      summary: Загрузить аватарку
      description: Файл до 5 МБ, форматы jpeg, png, webp. Старая аватарка удаляется.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Аватарка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Нет файла в поле avatar
        '401':
          description: Нет куки или она истекла
        '413':
          description: Файл больше 5 МБ
        '415':
          description: Формат не jpeg, png или webp

  /notes/all:
    get:
      tags: [notes]
      operationId: ListNotes
      summary: Список своих заметок
      description: Сначала недавно изменённые. Блоков в списке нет.
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Список заметок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '400':
          description: limit вне 1..100 или offset меньше 0
        '401':
          description: Нет куки или она истекла

  /notes:
    post:
      tags: [notes]
      operationId: CreateNote
      summary: Создать заметку
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Заметка создана, blocks пустой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Не прошла валидация или битый JSON
        '401':
          description: Нет куки или она истекла
        '404':
          description: Родительская заметка не найдена
        '413':
          description: Тело запроса больше 1 МБ

  /notes/{id}:
    parameters:
      - $ref: '#/components/parameters/NoteID'
    get:
      tags: [notes]
      operationId: GetNote
      summary: Заметка с блоками
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Заметка, блоки по порядку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: id не UUID
        '401':
          description: Нет куки или она истекла
        '404':
          description: Заметки нет или она чужая
    put:
      tags: [notes]
      operationId: UpdateNote
      summary: Сохранить заметку целиком
      description: |
        Блоки сохраняются в порядке массива. Блок без id создаётся, с id обновляется,
        блоки, которых нет в массиве, удаляются.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
      responses:
        '200':
          description: Заметка сохранена, у новых блоков появились id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Не прошла валидация, битый JSON или id не UUID
        '401':
          description: Нет куки или она истекла
        '404':
          description: Заметки нет или она чужая
        '413':
          description: Тело запроса больше 1 МБ
    delete:
      tags: [notes]
      operationId: DeleteNote
      summary: Удалить заметку
      description: Удаляются вложенные заметки, блоки и файлы.
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Заметка удалена
        '400':
          description: id не UUID
        '401':
          description: Нет куки или она истекла
        '404':
          description: Заметки нет или она чужая

  /blocks/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/BlockID'
    post:
      tags: [attachments]
      operationId: UploadAttachment
      summary: Прикрепить файл к блоку
      description: Файл до 10 МБ, форматы jpeg, png, webp, gif, pdf.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Файл загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          description: Нет файла в поле file или id не UUID
        '401':
          description: Нет куки или она истекла
        '404':
          description: Блока нет или он в чужой заметке
        '413':
          description: Файл больше 10 МБ
        '415':
          description: Неподдерживаемый формат

  /attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/AttachmentID'
    get:
      tags: [attachments]
      operationId: GetAttachment
      summary: Скачать файл
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Сам файл, Content-Type по типу файла
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: id не UUID
        '401':
          description: Нет куки или она истекла
        '404':
          description: Файла нет или он в чужой заметке
    delete:
      tags: [attachments]
      operationId: DeleteAttachment
      summary: Удалить файл
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Файл удалён
        '400':
          description: id не UUID
        '401':
          description: Нет куки или она истекла
        '404':
          description: Файла нет или он в чужой заметке

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bnn_access

  parameters:
    NoteID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BlockID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    SignUpRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 20
          example: seyran
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: password123

    SignInRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 20
          example: seyran
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: password123

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          example: password123
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          example: newpassword456

    User:
      type: object
      required: [id, login, avatar, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
          example: seyran
        avatar:
          type: string
          description: Путь к картинке или пустая строка, если аватарки нет
          example: /avatars/8e1d4c2a-6b3f-4f0e-9a1d-2c7e5b8f1a30.jpg
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Note:
      type: object
      required: [id, created_by, title, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        parent_note_id:
          type: string
          format: uuid
          description: Есть только у вложенных заметок
        created_by:
          type: string
          format: uuid
        title:
          type: string
          example: Моя заметка
        header:
          type: string
          description: Нет в ответе, если пустой
        icon:
          type: string
          description: Нет в ответе, если пустой
        blocks:
          type: array
          description: Только в ответах на одну заметку, в списке нет
          items:
            $ref: '#/components/schemas/Block'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Block:
      type: object
      required: [id, content, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        content:
          $ref: '#/components/schemas/BlockContent'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BlockContent:
      type: object
      description: Произвольный JSON блока
      additionalProperties: true
      example:
        type: text
        text: Привет

    CreateNoteRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          default: ""
          example: Новая заметка
        parent_note_id:
          type: string
          format: uuid
          description: Если заметка вложенная
        header:
          type: string
        icon:
          type: string

    UpdateNoteRequest:
      type: object
      required: [title, blocks]
      properties:
        title:
          type: string
          maxLength: 255
          example: Новая заметка
        header:
          type: string
        icon:
          type: string
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/BlockInput'

    BlockInput:
      type: object
      required: [content]
      properties:
        id:
          type: string
          format: uuid
          description: Нет у нового блока
        content:
          $ref: '#/components/schemas/BlockContent'

    Attachment:
      type: object
      required: [id, block_id, url]
      properties:
        id:
          type: string
          format: uuid
        block_id:
          type: string
          format: uuid
        url:
          type: string
          description: Откуда скачать файл
          example: /api/attachments/3f9b71d0-2a4c-4b8e-9d1f-6c5e7a8b9c0d