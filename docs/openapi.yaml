openapi: "3.0.3"
info:
  title: BNN Notes API
  version: 1.0.0
  description: |
    Авторизация через куки bnn_access (15 мин) и bnn_refresh (30 дней).
    На 401 вызвать /auth/refresh и повторить запрос. Если refresh тоже 401, то на страницу входа.
    На POST, PUT и DELETE (кроме signup, signin, refresh, logout и 2fa/verify) нужен заголовок
    X-CSRF-Token со значением куки bnn_csrf. Кука ставится при входе и обновляется при refresh.
    Без заголовка или с другим значением ответ 403.
    Ошибки OnlineConf возвращаются как JSON с полями code и message.
    Ответы 401 и отказы существующей CSRF-проверки могут быть без тела.

servers:
 - url: /api


tags:
  - name: auth
    description: Регистрация, вход, сессии, профиль
  - name: notes
    description: Заметки и блоки
  - name: attachments
    description: Файлы в блоках заметок
  - name: tags
    description: Теги заметок
  - name: onlineconf
    description: Админка OnlineConf, только для админов
  - name: onlineconf-runtime
    description: Конфиги и флаги OnlineConf для продукта

paths:
  /auth/signup:
    post:
      tags: [auth]
      operationId: SignUp
      summary: Регистрация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Пользователь создан, ставятся куки bnn_access и bnn_refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Не прошла валидация или битый JSON
        '409':
          description: Логин занят
        '413':
          description: Тело запроса больше 4096 байт

  /auth/signin:
    post:
      tags: [auth]
      operationId: SignIn
      summary: Вход
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Вход выполнен, ставятся куки bnn_access и bnn_refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '202':
          description: Пароль верный, но включена 2FA. Ставится кука bnn_2fa на 5 минут, дальше отправить код в /auth/2fa/verify
        '400':
          description: Битый JSON
        '401':
          description: Неверный логин или пароль
        '403':
          description: Аккаунт создан через GitHub, войти можно только через GitHub
        '413':
          description: Тело запроса больше 4096 байт

  /auth/refresh:
    post:
      tags: [auth]
      operationId: Refresh
      summary: Обновить токены
      description: Берёт куку bnn_refresh, ставит новые bnn_access и bnn_refresh. Старый refresh больше не работает.
      responses:
        '200':
          description: Новые куки поставлены
        '401':
          description: Нет куки, refresh невалиден, уже использован или истёк

  /auth/logout:
    post:
      tags: [auth]
      operationId: Logout
      summary: Выход
      description: Удаляет сессию этого устройства и стирает обе куки. Работает и без куки.
      responses:
        '200':
          description: Выход выполнен

  /auth/me:
    get:
      tags: [auth]
      operationId: GetCurrentUser
      summary: Текущий пользователь
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Нет куки или она истекла
        '404':
          description: Пользователь не найден

  /auth/password:
    put:
      tags: [auth]
      operationId: ChangePassword
      summary: Сменить пароль
      description: Все остальные устройства разлогиниваются, текущему ставятся новые куки.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Пароль изменён, ставятся новые куки bnn_access и bnn_refresh
        '400':
          description: Новый пароль не прошёл валидацию, битый JSON или аккаунт создан через GitHub и пароля у него нет
        '401':
          description: Нет куки или она истекла
        '403':
          description: Неверный старый пароль
        '413':
          description: Тело запроса больше 4096 байт

  /auth/avatar:
    put:
      tags: [auth]
      operationId: UpdateAvatar
      summary: Загрузить аватарку
      description: Файл до 5 МБ, форматы jpeg, png, webp. Старая аватарка удаляется.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Аватарка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Нет файла в поле avatar
        '401':
          description: Нет куки или она истекла
        '413':
          description: Файл больше 5 МБ
        '415':
          description: Формат не jpeg, png или webp

  /auth/2fa/generate:
    get:
      tags: [auth]
      operationId: Generate2FA
      summary: Получить QR-код для 2FA
      security:
        - cookieAuth: []
      responses:
        '200':
          description: PNG с QR-кодом
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: Нет куки или она истекла
        '409':
          description: 2FA уже включена, сначала выключить

  /auth/2fa/enable:
    post:
      tags: [auth]
      operationId: Enable2FA
      summary: Подтвердить и включить 2FA
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
      responses:
        '200':
          description: 2FA включена
        '400':
          description: QR-код ещё не получали или битый JSON
        '401':
          description: Нет куки или она истекла
        '403':
          description: Неверный код

  /auth/2fa/disable:
    post:
      tags: [auth]
      operationId: Disable2FA
      summary: Выключить 2FA
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
      responses:
        '200':
          description: 2FA выключена
        '401':
          description: Нет куки или она истекла
        '403':
          description: Неверный код или 2FA не включена

  /auth/2fa/verify:
    post:
      tags: [auth]
      operationId: Verify2FA
      summary: Второй шаг входа, код из приложения
      description: Нужна кука bnn_2fa, которую ставит /auth/signin или вход через GitHub.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
      responses:
        '200':
          description: Вход выполнен, ставятся куки bnn_access и bnn_refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Битый JSON
        '401':
          description: Нет куки bnn_2fa или прошло больше 5 минут, нужно войти заново
        '403':
          description: Неверный код


  /auth/github/login:
    get:
      tags: [auth]
      operationId: GitHubLogin
      summary: Вход через GitHub
      description: Перенаправляет пользователя на страницу авторизации GitHub.
      responses:
        '307':
          description: Редирект на GitHub, ставится кука oauth_state на 10 минут
          headers:
            Location:
              required: true
              schema:
                type: string

  /auth/github/callback:
    get:
      tags: [auth]
      operationId: GitHubCallback
      summary: Callback от GitHub
      description: Обрабатывает код авторизации от GitHub, создает пользователя (если нужно) и ставит куки.
      parameters:
        - name: code
          in: query
          required: true
          description: Код авторизации от GitHub
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: Строка для защиты от CSRF
          schema:
            type: string
      responses:
        '307':
          description: Редирект на фронтенд, на /profile или на /login/2fa, если включена 2FA
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          description: Неверный state или отсутствует код

  /onlineconf/admin/session:
    get:
      tags: [onlineconf]
      operationId: GetOnlineConfSession
      summary: Проверка доступа к админке
      description: Админ получает 200, остальные 403. Признак админа в ответе не передаётся.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Пользователь — админ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfSession'
        '401':
          description: Нет куки или она истекла
        '403':
          description: Не админ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfError'

  /onlineconf/admin/users:
    get:
      tags: [onlineconf]
      operationId: SearchOnlineConfUsers
      summary: Поиск пользователей по логину
      description: Для списков принудительного включения и исключения. Не больше 10 пользователей.
      security:
        - cookieAuth: []
      parameters:
        - name: query
          in: query
          required: true
          description: Часть логина, без учёта регистра
          schema:
            type: string
      responses:
        '200':
          description: Найденные пользователи
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnlineConfUser'
        '400':
          description: Пустой или слишком длинный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfError'
        '401':
          description: Нет куки или она истекла
        '403':
          description: Не админ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfError'
  /onlineconf/runtime:
    get:
      tags: [onlineconf-runtime]
      operationId: GetOnlineConfRuntime
      summary: Конфиги и флаги для текущего пользователя
      description: |
        Ключи скоупа frontend и ключи с is_public. Флаги уже вычислены для пользователя из куки.
        Списки include/exclude и непубличные ключи не отдаются.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Текущие значения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfRuntime'
        '401':
          description: Нет куки или она истекла

  /onlineconf/admin/scopes:
    get:
      tags: [onlineconf]
      operationId: ListOnlineConfScopes
      summary: Области конфигурации
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Доступные scopes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnlineConfScope'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/keys:
    get:
      tags: [onlineconf]
      operationId: ListOnlineConfKeys
      summary: Каталог ключей
      description: До 200 ключей. Персональные настройки флагов не включаются.
      security:
        - cookieAuth: []
      parameters:
        - name: query
          in: query
          description: Часть имени ключа, без учёта регистра
          schema:
            type: string
        - name: scope
          in: query
          schema:
            $ref: '#/components/schemas/OnlineConfScope'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/OnlineConfKind'
      responses:
        '200':
          description: Найденные ключи
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnlineConfKey'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'
    post:
      tags: [onlineconf]
      operationId: CreateOnlineConfKey
      summary: Создать конфиг или флаг
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnlineConfKeyInput'
      responses:
        '201':
          description: Ключ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfKey'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [onlineconf]
      operationId: GetOnlineConfKey
      summary: Карточка ключа
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Ключ с полными настройками
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfKey'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'
    put:
      tags: [onlineconf]
      operationId: UpdateOnlineConfKey
      summary: Заменить настройки ключа
      description: Требуется текущая версия. Тип kind менять нельзя.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnlineConfUpdateKeyInput'
      responses:
        '200':
          description: Ключ сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfKey'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'
    delete:
      tags: [onlineconf]
      operationId: DeleteOnlineConfKey
      summary: Удалить ключ
      security:
        - cookieAuth: []
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '204':
          description: Ключ удалён
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/keys/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [onlineconf]
      operationId: ListOnlineConfHistory
      summary: История изменений ключа
      description: |
        Сначала последние изменения.
        История сохраняется после удаления ключа.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: История изменений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnlineConfHistoryEntry'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/rollout-plans:
    get:
      tags: [onlineconf]
      operationId: ListOnlineConfRolloutPlans
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnlineConfRolloutPlan'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'
    post:
      tags: [onlineconf]
      operationId: CreateOnlineConfRolloutPlan
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnlineConfRolloutPlanInput'
      responses:
        '201':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfRolloutPlan'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/rollout-plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [onlineconf]
      operationId: GetOnlineConfRolloutPlan
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfRolloutPlan'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'
    put:
      tags: [onlineconf]
      operationId: UpdateOnlineConfRolloutPlan
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnlineConfRolloutPlanInput'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfRolloutPlan'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'
    delete:
      tags: [onlineconf]
      operationId: DeleteOnlineConfRolloutPlan
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Успешно
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/keys/{id}/rollout-plan:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [onlineconf]
      operationId: SetOnlineConfRolloutPlan
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnlineConfSetRolloutPlanInput'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfKey'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/keys/{id}/rollout:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [onlineconf]
      operationId: GetOnlineConfRollout
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfRollout'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/keys/{id}/rollout/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [onlineconf]
      operationId: ApproveOnlineConfRollout
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnlineConfRolloutVersionInput'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfKey'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/keys/{id}/rollout/rollback:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [onlineconf]
      operationId: RollbackOnlineConfRollout
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnlineConfRolloutVersionInput'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfKey'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/keys/{id}/schedules:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [onlineconf]
      operationId: ListOnlineConfSchedules
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnlineConfSchedule'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'
    post:
      tags: [onlineconf]
      operationId: CreateOnlineConfSchedule
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnlineConfScheduleInput'
      responses:
        '201':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfSchedule'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/keys/{id}/schedules/{schedule_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: schedule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [onlineconf]
      operationId: DeleteOnlineConfSchedule
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Успешно
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/keys/{id}/evaluate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [onlineconf]
      operationId: EvaluateOnlineConfKey
      summary: Проверить флаг для пользователя
      description: Считается по снимку в памяти main, той же функцией, что и для продукта.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnlineConfEvaluateInput'
      responses:
        '200':
          description: Результат для пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfEvaluation'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/admins:
    get:
      tags: [onlineconf]
      operationId: ListOnlineConfAdmins
      summary: Список админов
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Админы по алфавиту логинов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnlineConfUser'
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /onlineconf/admin/admins/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [onlineconf]
      operationId: GrantOnlineConfAdmin
      summary: Выдать права админа
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Права выданы
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'
    delete:
      tags: [onlineconf]
      operationId: RevokeOnlineConfAdmin
      summary: Забрать права админа
      description: Забрать права у самого себя нельзя — 400.
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Права сняты
        '401':
          description: Нет действующей сессии
        default:
          $ref: '#/components/responses/OnlineConfFailure'

  /notes/all:
    get:
      tags: [notes]
      operationId: ListNotes
      summary: Список своих заметок
      description: Сначала недавно изменённые. Блоков в списке нет.
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Список заметок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '400':
          description: limit вне 1..100 или offset меньше 0
        '401':
          description: Нет куки или она истекла

  /notes:
    post:
      tags: [notes]
      operationId: CreateNote
      summary: Создать заметку
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Заметка создана, blocks пустой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Не прошла валидация или битый JSON
        '401':
          description: Нет куки или она истекла
        '404':
          description: Родительская заметка не найдена
        '413':
          description: Тело запроса больше 1 МБ

  /notes/favorites:
    get:
      tags: [notes]
      operationId: ListFavorites
      summary: Список избранных заметок
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Список избранных заметок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '401':
          description: Не авторизован

  /notes/{id}:
    parameters:
      - $ref: '#/components/parameters/NoteID'
    get:
      tags: [notes]
      operationId: GetNote
      summary: Заметка с блоками
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Заметка, блоки по порядку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: id не UUID
        '401':
          description: Нет куки или она истекла
        '404':
          description: Заметки нет или она чужая
    put:
      tags: [notes]
      operationId: UpdateNote
      summary: Сохранить заметку целиком
      description: |
        Блоки сохраняются в порядке массива. Блок без id создаётся, с id обновляется,
        блоки, которых нет в массиве, удаляются.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
      responses:
        '200':
          description: Заметка сохранена, у новых блоков появились id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Не прошла валидация, битый JSON, id не UUID, чужой блок или тег
        '401':
          description: Нет куки или она истекла
        '403':
          description: Forbidden
        '404':
          description: Заметки нет или она чужая
        '413':
          description: Тело запроса больше 1 МБ
    delete:
      tags: [notes]
      operationId: DeleteNote
      summary: Удалить заметку
      description: Удаляются вложенные заметки, блоки и файлы.
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Заметка удалена
        '400':
          description: id не UUID
        '401':
          description: Нет куки или она истекла
        '403':
          description: Forbidden
        '404':
          description: Заметки нет или она чужая

  /notes/{id}/favorite:
    parameters:
      - $ref: '#/components/parameters/NoteID'
    post:
      tags: [notes]
      operationId: AddFavorite
      summary: Добавить заметку в избранное
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Заметка добавлена в избранное
        '401':
          description: Не авторизован
        '404':
          description: Заметка не найдена
    delete:
      tags: [notes]
      operationId: RemoveFavorite
      summary: Удалить заметку из избранного
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Заметка удалена из избранного
        '401':
          description: Не авторизован
        '404':
          description: Заметка не найдена

  /notes/{id}/collaborators:
    parameters:
      - $ref: '#/components/parameters/NoteID'
    post:
      tags: [notes]
      operationId: AddCollaborator
      summary: "Добавить коллаборатора к заметке"
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCollaboratorRequest'
      responses:
        '201':
          description: "Участник успешно добавлен"
        '400':
          description: "Неверные данные (невалидная роль, попытка добавить себя)"
        '401':
          description: "Нет куки или она истекла"
        '403':
          description: "Только владелец может добавлять участников"
        '404':
          description: "Пользователь или заметка не найдены"

  /notes/{id}/collaborators/{user_id}:
    parameters:
      - $ref: '#/components/parameters/NoteID'
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [notes]
      operationId: RemoveCollaborator
      summary: "Удалить коллаборатора из заметки"
      security:
        - cookieAuth: []
      responses:
        '204':
          description: "Участник удален"
        '400':
          description: "Неверные данные (невалидная роль)"
        '401':
          description: "Нет куки или она истекла"
        '403':
          description: "Только владелец может удалять участников"
        '404':
          description: "Заметка или участник не найдены"

  /blocks/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/BlockID'
    post:
      tags: [attachments]
      operationId: UploadAttachment
      summary: Прикрепить файл к блоку
      description: |
        Форматы jpeg, png, webp, gif, pdf. Лимит размера — конфиг OnlineConf backend/attachments.max_file_size_bytes
        (по умолчанию 10 МиБ), загрузку можно выключить флагом backend/attachments.upload_enabled.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Файл загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          description: Нет файла в поле file или id не UUID
        '401':
          description: Нет куки или она истекла
        '403':
          description: Нет доступа к заметке (FORBIDDEN) или загрузка выключена флагом (FEATURE_DISABLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineConfError'
        '404':
          description: Блока нет или он в чужой заметке
        '413':
          description: Файл больше лимита
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTooLargeError'
        '415':
          description: Неподдерживаемый формат

  /attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/AttachmentID'
    get:
      tags: [attachments]
      operationId: GetAttachment
      summary: Скачать файл
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Сам файл, Content-Type по типу файла
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: id не UUID
        '401':
          description: Нет куки или она истекла
        '403':
          description: Forbidden
        '404':
          description: Файла нет или он в чужой заметке
    delete:
      tags: [attachments]
      operationId: DeleteAttachment
      summary: Удалить файл
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Файл удалён
        '400':
          description: id не UUID
        '401':
          description: Нет куки или она истекла
        '403':
          description: Forbidden
        '404':
          description: Файла нет или он в чужой заметке
  /tags:
    get:
      tags: [tags]
      operationId: ListTags
      summary: Мои теги
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Теги пользователя по названию
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '401':
          description: Нет куки или она истекла
    post:
      tags: [tags]
      operationId: CreateTag
      summary: Создать тег
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
      responses:
        '201':
          description: Тег создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          description: Не прошла валидация или битый JSON
        '401':
          description: Нет куки или она истекла
        '409':
          description: Тег с таким названием уже есть

  /tags/{id}:
    parameters:
      - $ref: '#/components/parameters/TagID'
    put:
      tags: [tags]
      operationId: UpdateTag
      summary: Изменить название и цвет
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
      responses:
        '200':
          description: Тег изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          description: Не прошла валидация, битый JSON или id не UUID
        '401':
          description: Нет куки или она истекла
        '404':
          description: Тега нет или он чужой
        '409':
          description: Тег с таким названием уже есть
    delete:
      tags: [tags]
      operationId: DeleteTag
      summary: Удалить тег
      description: Тег снимается со всех заметок.
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Тег удалён
        '400':
          description: id не UUID
        '401':
          description: Нет куки или она истекла
        '404':
          description: Тега нет или он чужой

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bnn_access

  responses:
    OnlineConfFailure:
      description: |
        400 VALIDATION — неверный запрос.
        400 ROLLOUT_STEP_NOT_ALLOWED — процент привязанного флага меняется через approve или rollback.
        403 FORBIDDEN — недостаточно прав.
        404 NOT_FOUND — ключ не найден.
        409 KEY_EXISTS — имя занято в scope.
        409 VERSION_CONFLICT — устаревшая версия.
        409 ROLLOUT_PLAN_EXISTS — имя регламента занято.
        409 ROLLOUT_PLAN_IN_USE — регламент привязан к флагу.
        409 ROLLOUT_NOT_READY — следующий этап ещё не доступен для подтверждения.
        409 SCHEDULE_FINISHED — задание уже выполнено или завершилось ошибкой.
        413 PAYLOAD_TOO_LARGE — слишком большой запрос.
        500 INTERNAL — внутренняя ошибка.
        503 SERVICE_UNAVAILABLE — зависимый сервис недоступен.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OnlineConfError'

  parameters:
    NoteID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BlockID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:

    OnlineConfEvaluateInput:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid

    OnlineConfEvaluation:
      type: object
      required: [result, reason, revision]
      properties:
        result:
          type: boolean
        reason:
          type: string
          enum: [disabled, excluded, included, rollout]
        revision:
          type: integer
          format: int64
          example: 42

    OnlineConfRuntime:
      type: object
      required: [revision, user_id, configs, flags]
      properties:
        revision:
          type: integer
          format: int64
          example: 42
        user_id:
          type: string
          format: uuid
        configs:
          type: object
          description: scope → ключ → значение
          additionalProperties:
            type: object
            additionalProperties: {}
          example: {"backend": {"attachments.max_file_size_bytes": 10485760}}
        flags:
          type: object
          description: scope → ключ → включён ли флаг
          additionalProperties:
            type: object
            additionalProperties:
              type: boolean
          example: {"backend": {"attachments.upload_enabled": true}}

    OnlineConfError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: FORBIDDEN
        message:
          type: string

    FileTooLargeError:
      type: object
      required: [code, message, limit_bytes]
      properties:
        code:
          type: string
          example: FILE_TOO_LARGE
        message:
          type: string
        limit_bytes:
          type: integer
          format: int64
          example: 10485760

    OnlineConfSession:
      type: object
      required: [login]
      properties:
        login:
          type: string

    OnlineConfUser:
      type: object
      required: [id, login]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
          example: seyran

    OnlineConfScope:
      type: string
      enum: [frontend, backend, auth, notes]

    OnlineConfKind:
      type: string
      enum: [config, flag]

    OnlineConfValueType:
      type: string
      enum: [string, number, boolean, object, array]

    OnlineConfConfig:
      type: object
      required: [value_type, value]
      properties:
        value_type:
          $ref: '#/components/schemas/OnlineConfValueType'
        value:
          description: JSON-значение, соответствующее value_type
          x-go-type: json.RawMessage

    OnlineConfFlag:
      type: object
      required: [enabled, rollout_percent]
      properties:
        enabled:
          type: boolean
        rollout_percent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        include_users:
          type: array
          items:
            $ref: '#/components/schemas/OnlineConfUser'
        exclude_users:
          type: array
          items:
            $ref: '#/components/schemas/OnlineConfUser'

    OnlineConfFlagInput:
      type: object
      required: [enabled, rollout_percent]
      properties:
        enabled:
          type: boolean
        rollout_percent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        include_user_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          x-go-name: IncludeUserIDs
          x-go-type-skip-optional-pointer: true
          items:
            type: string
            format: uuid
        exclude_user_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          x-go-name: ExcludeUserIDs
          x-go-type-skip-optional-pointer: true
          items:
            type: string
            format: uuid

    OnlineConfKey:
      type: object
      required:
        - id
        - scope
        - key
        - kind
        - description
        - is_public
        - version
        - updated_by
        - updated_at
      properties:
        rollout_plan_id:
          type: string
          format: uuid
        rollout_step:
          type: integer
          format: int32
        step_ready_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/OnlineConfScope'
        key:
          type: string
        kind:
          $ref: '#/components/schemas/OnlineConfKind'
        description:
          type: string
        is_public:
          type: boolean
        version:
          type: integer
          format: int32
        updated_by:
          $ref: '#/components/schemas/OnlineConfUser'
        updated_at:
          type: string
          format: date-time
        config:
          $ref: '#/components/schemas/OnlineConfConfig'
        flag:
          $ref: '#/components/schemas/OnlineConfFlag'

    OnlineConfHistoryEntry:
      type: object
      required:
        - id
        - action
        - old_value
        - new_value
        - user
        - created_at
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum: [create, update, delete]
        old_value:
          type: object
          nullable: true
          x-go-type: OnlineConfKey
          allOf:
            - $ref: '#/components/schemas/OnlineConfKey'
        new_value:
          type: object
          nullable: true
          x-go-type: OnlineConfKey
          allOf:
            - $ref: '#/components/schemas/OnlineConfKey'
        user:
          $ref: '#/components/schemas/OnlineConfUser'
        created_at:
          type: string
          format: date-time


    OnlineConfRolloutPlan:
      type: object
      required: [id, name, steps, interval_min]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        steps:
          type: array
          items:
            type: integer
            format: int32
        interval_min:
          type: integer
          format: int32

    OnlineConfRolloutPlanInput:
      type: object
      required: [name, steps, interval_min]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        steps:
          type: array
          minItems: 2
          maxItems: 101
          items:
            type: integer
            format: int32
            minimum: 0
            maximum: 100
        interval_min:
          type: integer
          format: int32
          minimum: 1

    OnlineConfSetRolloutPlanInput:
      type: object
      required: [plan_id, version]
      properties:
        plan_id:
          type: string
          format: uuid
          nullable: true
          description: null отвязывает регламент. Поле обязательно.
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        version:
          type: integer
          format: int32
          minimum: 1

    OnlineConfRolloutVersionInput:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int32
          minimum: 1

    OnlineConfRollout:
      type: object
      required: [key_id, plan, step, current_percent, next_percent, step_ready_at, status, version]
      properties:
        key_id:
          type: string
          format: uuid
        plan:
          type: object
          nullable: true
          x-go-type: OnlineConfRolloutPlan
          allOf:
            - $ref: '#/components/schemas/OnlineConfRolloutPlan'
        step:
          type: integer
          format: int32
          nullable: true
        current_percent:
          type: integer
          format: int32
        next_percent:
          type: integer
          format: int32
          nullable: true
        step_ready_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          description: unassigned, waiting, pending_approval или done. Индекс step начинается с нуля.
        version:
          type: integer
          format: int32

    OnlineConfScheduleInput:
      type: object
      required: [run_at]
      description: Нужен хотя бы один из параметров enabled и rollout_percent. Процент привязанного флага меняется через approve.
      properties:
        run_at:
          type: string
          format: date-time
        enabled:
          type: boolean
        rollout_percent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100

    OnlineConfSchedule:
      type: object
      required: [id, key_id, run_at, done, failed, error, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        key_id:
          type: string
          format: uuid
        run_at:
          type: string
          format: date-time
        enabled:
          type: boolean
        rollout_percent:
          type: integer
          format: int32
        done:
          type: boolean
        failed:
          type: boolean
        error:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    OnlineConfKeyInput:
      type: object
      description: |
        Для kind=config заполняется только config.
        Для kind=flag заполняется только flag.
        Проверка выполняется сервисом OnlineConf.
      required: [scope, key, kind, is_public]
      properties:
        scope:
          $ref: '#/components/schemas/OnlineConfScope'
        key:
          type: string
          maxLength: 100
          pattern: '^[a-zA-Z][a-zA-Z0-9_.-]{0,99}$'
        kind:
          $ref: '#/components/schemas/OnlineConfKind'
        description:
          type: string
          x-go-type-skip-optional-pointer: true
        is_public:
          type: boolean
        config:
          $ref: '#/components/schemas/OnlineConfConfig'
        flag:
          $ref: '#/components/schemas/OnlineConfFlagInput'

    OnlineConfUpdateKeyInput:
      allOf:
        - $ref: '#/components/schemas/OnlineConfKeyInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int32
              minimum: 1

    AddCollaboratorRequest:
      type: object
      required:
        - login
        - role
      properties:
        login:
          type: string
          example: "vasya1111"
        role:
          type: string
          enum: [editor, viewer]

    SignUpRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 20
          example: seyran
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: password123

    SignInRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Логин или email, если аккаунт создан через GitHub
          example: seyran
        password:
          type: string
          example: password123

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          example: password123
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          example: newpassword456

    User:
      type: object
      required: [id, login, avatar, is_2fa_enabled, oauth_provider, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
          example: seyran
        avatar:
          type: string
          description: Путь к картинке или пустая строка, если аватарки нет
          example: /avatars/8e1d4c2a-6b3f-4f0e-9a1d-2c7e5b8f1a30.jpg
        is_2fa_enabled:
          type: boolean
          description: Включена ли двухфакторная аутентификация
        oauth_provider:
          type: string
          nullable: true
          enum: [github]
          description: Через какой сервис создан аккаунт. null, если аккаунт с паролем
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Note:
      type: object
      required: [id, created_by, title, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        parent_note_id:
          type: string
          format: uuid
          description: Есть только у вложенных заметок
        created_by:
          type: string
          format: uuid
        title:
          type: string
          example: Моя заметка
        header:
          type: string
          description: Нет в ответе, если пустой
        icon:
          type: string
          description: Нет в ответе, если пустой
        blocks:
          type: array
          description: Только в ответах на одну заметку, в списке нет
          items:
            $ref: '#/components/schemas/Block'
        tags:
          type: array
          description: Только в ответах на одну заметку, в списке нет
          items:
            $ref: '#/components/schemas/Tag'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Block:
      type: object
      required: [id, content, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        content:
          $ref: '#/components/schemas/BlockContent'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BlockContent:
      type: object
      description: Произвольный JSON блока
      additionalProperties: true
      example:
        type: text
        text: Привет

    CreateNoteRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          default: ""
          example: Новая заметка
        parent_note_id:
          type: string
          format: uuid
          description: Если заметка вложенная
        header:
          type: string
        icon:
          type: string

    UpdateNoteRequest:
      type: object
      required: [title, blocks]
      properties:
        title:
          type: string
          maxLength: 255
          example: Новая заметка
        header:
          type: string
        icon:
          type: string
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/BlockInput'
        tag_ids:
          type: array
          description: Нет поля — теги не меняются, пустой массив — снять все теги
          items:
            type: string
            format: uuid

    BlockInput:
      type: object
      required: [content]
      properties:
        id:
          type: string
          format: uuid
          description: Нет у нового блока
        content:
          $ref: '#/components/schemas/BlockContent'

    Attachment:
      type: object
      required: [id, block_id, url]
      properties:
        id:
          type: string
          format: uuid
        block_id:
          type: string
          format: uuid
        url:
          type: string
          description: Откуда скачать файл
          example: /api/attachments/3f9b71d0-2a4c-4b8e-9d1f-6c5e7a8b9c0d
    Tag:
      type: object
      required: [id, name, color, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: учёба
        color:
          type: string
          description: '#RRGGBBAA, последние два символа это прозрачность'
          example: '#FF880080'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TagRequest:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          example: учёба
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{8}$'
          example: '#FF880080'

    TwoFactorCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6 цифр из приложения-аутентификатора
          example: '123456'

