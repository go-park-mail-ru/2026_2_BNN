openapi: "3.0.0"
info:
  title: BNN Notes API
  version: 1.0.0
  description: API для сервиса заметок (аналог Notion)

paths:
  /auth/signup:
    post:
      operationId: SignUp
      summary: Регистрация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Некорректные данные
        '409':
          description: Логин уже занят

  /auth/signin:
    post:
      operationId: SignIn
      summary: Вход в систему
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Некорректные данные
        '401':
          description: Неверный логин или пароль

  /auth/logout:
    post:
      operationId: Logout
      summary: Выход из системы
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Успешный выход
        '401':
          description: Не авторизован

  /auth/me:
    get:
      operationId: GetCurrentUser
      summary: Получить профиль текущего пользователя
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Не авторизован
        '404':
          description: Пользователь не найден

  /notes/getall:
    get:
      operationId: ListNotes
      summary: Получить список заметок
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Список заметок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '400':
          description: Некорректные параметры пагинации
        '401':
          description: Не авторизован

  /notes/{id}:
    get:
      operationId: GetNote
      summary: Получить заметку по ID
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Заметка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Некорректный ID
        '401':
          description: Не авторизован
        '404':
          description: Заметка не найдена

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bnn_jwt

  schemas:
    SignUpRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 20
        password:
          type: string
          minLength: 8
          maxLength: 128

    SignInRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
        password:
          type: string

    User:
      type: object
      required:
        - id
        - login
        - avatar
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        avatar:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Note:
      type: object
      required:
        - id
        - title
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        created_by:
          type: string
          format: uuid
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/Block'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Block:
      type: object
      required:
        - id
        - content
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time