global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: main
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:9101"]

  - job_name: auth
    metrics_path: /api/metrics
    static_configs:
      - targets: ["auth:9102"]

  - job_name: notes
    metrics_path: /api/metrics
    static_configs:
      - targets: ["notes:9103"]