events {}

http {

 include /etc/nginx/mime.types;

 server {
    server_name brandnewnotes.ru;

    root /opt/public;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/handlebars@4.7.9/dist/handlebars.runtime.min.js 'sha256-w36slEqa9euNKxfvkw+LLGsDIr++3rsZXpZxtmRh8Aw=' 'sha256-+5XkZFazzJo8n0iOP4ti/cLCMUudTf//Mzkb7xNPXIc=' 'sha256-MS6/3FCg4WjP9gwgaBGwLpRCY6fZBgwmhVCdrPrNf3E='; img-src 'self' data: blob: https://avatars.githubusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://bnn-backend:5458;
    }

    location /swagger/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://bnn-backend:5458/swagger/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /avatars/ {
        proxy_pass http://bnn-s3:9000/avatars/;
    }



    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/brandnewnotes.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/brandnewnotes.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
 }

 server {
    if ($host = brandnewnotes.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    server_name brandnewnotes.ru;
    return 404; # managed by Certbot
 }
}